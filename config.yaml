world:
    data_file: world_generator/data/dummy.json
    capture_video: false
    victims:
        count: 100
        t_max: '10:00:00'
        t_min: '05:00:00'
        t_var: '00:30:00'
gui:
    verbose: 2
    save_gif: false
    optimizer_types: [random, greedy_t, greedy_u, greedy_mcdm, hybrid, ga]
    preprocessing_types: [closest, shortest_path]
    analysis_types: [heatmap, 
                     victim,
                     utility, 
                     energy, 
                     tasks, 
                     area,
                     distance]
    charger_types: [static, center_of_mass]
mission:
    t_end: '08:00:00'
    PI_model: search_PI.fis
    milp_solver: milp_v2
    prediction_errors: false
    coordination_radius: 3
    q_init: [100,100]
    task_evaluation_model: task_evaluation.mat
    tasks:
        map:
            type: map
            pi_init: ismember(node, frontier) && ~ismember(node, task_nodes)
            pi_complete: ~ismember(node, frontier)
        search:
            type: search
            pi_init: PI >= 0.1
            pi_complete: ismember(node, measured)
    mcdm:
        t: 1
        m: 4
        s: 8
        mt: 7
        st: 15
        ms: 20
        mst: 20
    charger:
        id: charger
        max_step: 0.5
        speed: 0.025
        color: white
        policy: 
            optimizer: static
            control_horizon: 5
            task_proximity: 10
    robots:
        ugv:
            count: 1
        uav: 
            count: 0
        crawler:
            count: 0